# GoReleaser config for the Rilldrop CLI.
# Run `goreleaser check` to validate, `goreleaser release --snapshot --clean`
# to test locally. Tag a release (e.g. v1.0.0) to trigger the real pipeline.
version: 2

project_name: rilldrop

builds:
  - id: rilldrop
    dir: cli
    main: ./cmd/rilldrop
    binary: rilldrop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: rilldrop
    name_template: "rilldrop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^refactor:"
      - "^Merge pull request"
      - "^Merge branch"
      - "^Merge remote-tracking"
      - "^initial commit"

# Homebrew Cask (macOS) — published into the shared Arnavsharma2/homebrew-tap.
# This tap is reused across projects; rilldrop is one cask inside it.
# Requires: create Arnavsharma2/homebrew-tap repo and add TAP_GITHUB_TOKEN secret.
# Install: brew install --cask Arnavsharma2/tap/rilldrop
# Update:  brew upgrade rilldrop
homebrew_casks:
  - name: rilldrop
    repository:
      owner: Arnavsharma2
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Arnavsharma2/rilldrop"
    description: "Secure peer-to-peer file transfer CLI"
    license: "MIT"

# Scoop (Windows) — published into the shared Arnavsharma2/scoop-bucket.
# This bucket is reused across projects; rilldrop is one manifest inside it.
# Requires: create Arnavsharma2/scoop-bucket repo (same TAP_GITHUB_TOKEN).
# Install: scoop bucket add Arnavsharma2 https://github.com/Arnavsharma2/scoop-bucket && scoop install rilldrop
# Update:  scoop update rilldrop
scoops:
  - repository:
      owner: Arnavsharma2
      name: scoop-bucket
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/Arnavsharma2/rilldrop"
    description: "Secure peer-to-peer file transfer CLI"
    license: MIT

# Winget (Windows, official Microsoft store).
# Requires: fork microsoft/winget-pkgs to Arnavsharma2/winget-pkgs (same PAT).
# PRs are auto-validated and typically merged within a few hours.
# Install: winget install Arnavsharma2.rilldrop
# Update:  winget upgrade Arnavsharma2.rilldrop
winget:
  - name: rilldrop
    publisher: Arnavsharma2
    package_identifier: Arnavsharma2.rilldrop
    license: MIT
    homepage: "https://github.com/Arnavsharma2/rilldrop"
    short_description: "Secure peer-to-peer file transfer CLI"
    repository:
      owner: Arnavsharma2
      name: winget-pkgs
      branch: "rilldrop-{{ .Version }}"
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master


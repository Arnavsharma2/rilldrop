# GoReleaser config for the Rilldrop CLI.
# Run `goreleaser check` to validate, `goreleaser release --snapshot --clean`
# to test locally. Tag a release (e.g. v1.0.0) to trigger the real pipeline.
version: 2

project_name: rilldrop

builds:
  - id: rilldrop
    dir: cli
    main: ./cmd/rilldrop
    binary: rilldrop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: rilldrop
    name_template: "rilldrop_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^style:"
      - "^refactor:"
      - "^Merge pull request"
      - "^Merge branch"
      - "^Merge remote-tracking"
      - "^initial commit"

release:
  github:
    owner: Arnavsharma2
    name: rilldrop
